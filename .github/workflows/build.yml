name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Репозитории Maven для Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/repos.gradle <<'EOF'
          beforeSettings { settings ->
              try {
                  settings.pluginManagement.repositories {
                      mavenCentral()
                      google()
                      gradlePluginPortal()
                  }
              } catch (Throwable ignored) { }
          }
          allprojects { p ->
              try {
                  p.buildscript.repositories {
                      mavenCentral()
                      google()
                      gradlePluginPortal()
                  }
              } catch (Throwable ignored) { }
          }
          EOF
          cat ~/.gradle/init.d/repos.gradle

      - name: Достроить android, если неполный
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            flutter create --platforms=android --org ru.family --project-name family_box /tmp/scaffold
            mkdir -p android
            cp -rn /tmp/scaffold/android/. ./android/
          fi
          flutter --version

      - name: Совместимость версий
        run: |
          printf '\nandroid.builtInKotlin=false\nandroid.newDsl=false\n' >> android/gradle.properties
          for F in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$F" ] || continue
            sed -i -E 's/(minSdk[[:space:]]*=?[[:space:]]*)[0-9]+/\123/' "$F"
          done
          grep -nE 'minSdk|targetSdk|compileSdk' android/app/build.gradle* || true

      - name: Зависимости
        run: flutter pub get

      - name: Сборка универсального APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Подпись и раскладка
        run: |
          mkdir -p dist
          SRC=build/app/outputs/flutter-apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/key.jks"
            BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 "$SRC/app-release.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/key.jks" \
              --ks-pass pass:"${{ secrets.STORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --out "dist/kaluga-universal.apk" "$RUNNER_TEMP/aligned.apk"
          else
            cp "$SRC/app-release.apk" dist/kaluga-universal.apk
          fi
          ls -lh dist

      - name: Готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: kaluga-universal-apk
          path: dist/*.apk
          retention-days: 30
